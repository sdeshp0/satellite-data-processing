name: satellite-data-processing
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.11

  # Scientific stack
  - numpy>=1.25
  - pandas>=2.0
  - xarray>=2024.1
  - rasterio>=1.3
  - rioxarray>=0.15
  - shapely>=2.0
  - matplotlib>=3.8
  - pillow>=10.0
  - scikit-image>=0.19

  # Planetary Computer + STAC
  - pystac-client>=0.8
  - planetary-computer

  # Streamlit + Folium-based maps
  - streamlit>=1.50
  - leafmap>=0.31

  # Jupyter (optional but useful)
  - jupyterlab
  - ipykernel

  # pip section
  - pip
  - pip:
      - geopy>=2.4
      - requests>=2.31
      - pyproj>=3.6